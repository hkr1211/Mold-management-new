services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    restart: always
    volumes:
      - .:/app
      - sqlite_data:/app/data
    ports:
      - "8501:8501"
    environment:
      - SQLITE_DB_PATH=/app/data/mold_management.db

  nginx:
    profiles: ["edge"]
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app

  backup:
    profiles: ["backup"]
    image: alpine:3.19
    restart: always
    volumes:
      - sqlite_data:/data:ro
      - ./scripts/backup.sh:/backup.sh:ro
      - db_backups:/backups
    entrypoint: >
      sh -c "echo '0 2 * * * sh /backup.sh >> /backups/backup.log 2>&1'
             | crontab - && crond -f -d 8"

volumes:
  sqlite_data:
  db_backups:
